[project]
name = "pet-adoption-agents"
version = "0.1.0"
description = "Pet adoption agents system with Petfinder API integration"
authors = [
    {name = "Pet Adoption Team", email = "team@petadoption.com"},
]
dependencies = [
    "aiohttp>=3.8.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "impyla>=0.18.0",
    "reportlab>=4.4.2",
    "openai>=1.95.1",
    "google-cloud-aiplatform>=1.90.0",
]
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
] 
